<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포트폴리오</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body>
    <header id="header">
        <nav class="navbar">
            <div class="logo">MyPortfolio</div>
            <ul class="nav-menu">
                <li><a href="#hero">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
            <button id="theme-toggle" aria-label="테마 전환">🌙</button>
            <button id="hamburger" aria-label="메뉴 열기">☰</button>
        </nav>
    </header>

    <main>
        <section id="hero" class="section">
            <h1>안녕하세요, 개발자 홍다윤입니다.</h1>
            <p>웹의 원리를 탐구하는 포트폴리오입니다.</p>
            <a href="#projects" class="btn">프로젝트 보기</a>
        </section>

        <section id="about" class="section">
            <h2>About Me</h2>
            <img src="images/IMG_2061.JPG" alt="프로필 사진" class="profile-img">
            <p>안녕하세요! 배움을 즐기는 웹 개발자입니다.</p>
        </section>

        <section id="skills" class="section">
            <h2>Skills</h2>
            <ul class="skills-list">
                <li>HTMl5</li>
                <li>CSS3</li>
                <li>JavaScript</li>
            </ul>
        </section>

        <section id="projects" class="section">
            <h2>Projects</h2>
            <div id="projects-container" class="projects-grid"></div>
            <div id="projects-status" class="projects-status"></div>
        </section>

        <section id="contact" class="section">
            <h2>Contact</h2>
            <form id="contact-form">
                <div class="form-group">
                    <label for="name">이름</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">메시지</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn">보내기</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 홍다윤. All rights reserved.</p>

        <div class="social-links">
            <a href="mailto:eldbsop@khu.ac.kr">Email: eldbsop@khu.ac.kr</a>
        </div>

    </footer>

    <button id="back-to-top" class="back-to-top">⬆️</button>

    <script src="js/main.js"></script>
    
</body>
</html>
